<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookhouse Staff Dashboard</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1F1A; --paper:#F5F4EF; --panel:#FFFFFF;
    --olive:#41522F; --olive-dark:#2C3820; --olive-light:#EAEFE2;
    --amber:#B9822E; --amber-light:#FBF0DD;
    --muted:#6B6B63; --line:#DEDBD0; --danger:#A5402F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;}
  .wrap{max-width:980px;margin:0 auto;padding:32px 24px 60px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--olive);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:2px 0 0;}
  .live-tag{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--olive);text-transform:uppercase;letter-spacing:0.06em;}
  .live-tag .dot{width:6px;height:6px;background:var(--olive);border-radius:50%;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .tabs{display:flex;gap:6px;margin-bottom:20px;}
  .tab-btn{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;padding:9px 16px;
    border-radius:8px;border:1.4px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
  .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:20px;}
  .panel h2{font-size:16px;margin:0 0 14px;font-family:'Space Grotesk',sans-serif;}

  .meal-pills{display:flex;gap:8px;margin-bottom:20px;}
  .meal-pill{font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 14px;border-radius:20px;
    border:1.4px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);}
  .meal-pill.active{background:var(--olive);border-color:var(--olive);color:#fff;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:6px;}
  .stat-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
  .stat-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;
    font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
  .stat-card .value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;}
  .stat-card.total .value{color:var(--olive);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.06em;
    text-transform:uppercase;color:var(--muted);padding:0 10px 10px;border-bottom:1.5px solid var(--ink);}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .course-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;
    background:var(--olive-light);color:var(--olive-dark);}
  .time-cell{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12.5px;}

  .manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:720px){.manage-grid{grid-template-columns:1fr;}}
  .row-inline{display:flex;gap:8px;margin-bottom:12px;}
  input,select{padding:9px 11px;border:1.4px solid var(--line);border-radius:7px;font-size:13.5px;
    font-family:'Inter',sans-serif;flex:1;}
  button.small{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:9px 14px;
    background:var(--olive);color:#fff;border:none;border-radius:7px;cursor:pointer;white-space:nowrap;}
  button.small:hover{background:var(--olive-dark);}
  button.del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .list-item:last-child{border-bottom:none;}
  .list-item .sub{font-size:11.5px;color:var(--muted);}

  .override-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;}
  .override-row{display:flex;align-items:center;gap:10px;}
  .override-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}
  .switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#C7C4B6;border-radius:20px;transition:0.15s;}
  .slider::before{content:"";position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.15s;}
  input:checked + .slider{background:var(--danger);}
  input:checked + .slider::before{transform:translateX(16px);}
  #override-meal-row{margin-top:8px;}
  #override-meal-row select{width:100%;font-size:12.5px;padding:6px 8px;}

  .edit-btn{background:none;border:none;color:var(--olive);cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;margin-right:10px;}
  .list-item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
  .list-item-row:last-child{border-bottom:none;}
  .list-item-actions{display:flex;align-items:center;flex-shrink:0;}
  .edit-form{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);}
  .edit-form input, .edit-form select{padding:7px 9px;font-size:13px;}
  .save-btn{background:var(--olive);color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;}
  .cancel-btn{background:none;border:1.4px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted);}

  .report-btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;
    background:var(--ink);color:#fff;border:none;border-radius:8px;cursor:pointer;margin-left:auto;}
  .report-btn:hover{background:#000;}
  .meal-pills-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Cookhouse Staff Dashboard</div>
      <h1 id="site-heading">Today's sign-ins</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      <span class="live-tag"><span class="dot"></span> Live</span>
      <div class="override-box" id="override-box">
        <div class="override-row">
          <span class="override-label" id="override-status">Auto (time-based)</span>
          <label class="switch">
            <input type="checkbox" id="override-toggle">
            <span class="slider"></span>
          </label>
        </div>
        <div id="override-meal-row" style="display:none;">
          <select id="override-meal-select">
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-dashboard-btn">Dashboard</button>
    <button class="tab-btn" id="tab-manage-btn">Manage courses &amp; students</button>
  </div>

  <div id="tab-dashboard">
    <div class="meal-pills-row">
      <div class="meal-pills">
        <button class="meal-pill active" data-meal="breakfast">Breakfast</button>
        <button class="meal-pill" data-meal="lunch">Lunch</button>
        <button class="meal-pill" data-meal="dinner">Dinner</button>
      </div>
      <button class="report-btn" id="download-report-btn">Download today's report</button>
    </div>

    <div class="panel">
      <div class="stat-row" id="stat-row"></div>
    </div>

    <div class="panel">
      <h2>Recent sign-ins</h2>
      <table>
        <thead><tr><th>Name</th><th>Course</th><th>Time</th></tr></thead>
        <tbody id="log-body"><tr><td colspan="3" style="color:var(--muted);">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-manage" style="display:none;">
    <div class="manage-grid">
      <div class="panel">
        <h2>Courses</h2>
        <div class="row-inline">
          <input id="new-course-name" placeholder="New course name" />
          <button class="small" id="add-course-btn">Add</button>
        </div>
        <div id="course-list"></div>
      </div>
      <div class="panel">
        <h2>Students</h2>
        <div class="row-inline">
          <input id="new-student-name" placeholder="Student name" />
          <select id="new-student-course"><option value="">Course</option></select>
          <button class="small" id="add-student-btn">Add</button>
        </div>
        <div id="student-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
let activeMeal = 'breakfast';
let coursesCache = [];

function switchTab(which) {
  document.getElementById('tab-dashboard').style.display = which === 'dashboard' ? 'block' : 'none';
  document.getElementById('tab-manage').style.display = which === 'manage' ? 'block' : 'none';
  document.getElementById('tab-dashboard-btn').classList.toggle('active', which === 'dashboard');
  document.getElementById('tab-manage-btn').classList.toggle('active', which === 'manage');
  if (which === 'manage') loadManageLists();
}
document.getElementById('tab-dashboard-btn').addEventListener('click', () => switchTab('dashboard'));
document.getElementById('tab-manage-btn').addEventListener('click', () => switchTab('manage'));

document.querySelectorAll('.meal-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.meal-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeMeal = btn.dataset.meal;
    loadDashboard();
  });
});

async function loadDashboard() {
  const today = todayDateString();
  const { data: rows, error } = await supabaseClient
    .from('signins')
    .select('id, meal, signed_in_at, students(name), courses(name)')
    .eq('meal', activeMeal)
    .eq('signin_date', today)
    .order('signed_in_at', { ascending: false });

  if (error) {
    document.getElementById('log-body').innerHTML =
      '<tr><td colspan="3" style="color:var(--danger);">Could not load data. Check config.js Supabase settings.</td></tr>';
    return;
  }

  const total = rows.length;
  const byCourse = {};
  rows.forEach(r => {
    const name = r.courses ? r.courses.name : 'Unknown';
    byCourse[name] = (byCourse[name] || 0) + 1;
  });

  const statRow = document.getElementById('stat-row');
  statRow.innerHTML = `<div class="stat-card total"><div class="label">Total — ${activeMeal}</div><div class="value">${total}</div></div>` +
    Object.entries(byCourse).map(([name, count]) =>
      `<div class="stat-card"><div class="label">${name}</div><div class="value">${count}</div></div>`
    ).join('');

  document.getElementById('log-body').innerHTML = rows.length ? rows.map(r => `
    <tr>
      <td>${r.students ? r.students.name : 'Unknown'}</td>
      <td><span class="course-pill">${r.courses ? r.courses.name : 'Unknown'}</span></td>
      <td class="time-cell">${new Date(r.signed_in_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
    </tr>`).join('') : '<tr><td colspan="3" style="color:var(--muted);">No sign-ins yet for this sitting.</td></tr>';
}

let studentsCache = [];

async function loadManageLists() {
  const { data: courses } = await supabaseClient.from('courses').select('id, name').order('name');
  coursesCache = courses || [];

  renderCourseList();

  const courseSelect = document.getElementById('new-student-course');
  courseSelect.innerHTML = '<option value="">Course</option>' +
    coursesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

  const { data: students } = await supabaseClient
    .from('students').select('id, name, course_id, courses(name)').order('name');
  studentsCache = students || [];

  renderStudentList();
}

function renderCourseList() {
  const el = document.getElementById('course-list');
  if (!coursesCache.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px;">No courses yet.</p>'; return; }

  el.innerHTML = coursesCache.map(c => `
    <div class="list-item-row" data-row-course="${c.id}">
      <span>${c.name}</span>
      <div class="list-item-actions">
        <button class="edit-btn" data-edit-course="${c.id}">Edit</button>
        <button class="del" data-id="${c.id}" data-type="course">Remove</button>
      </div>
    </div>`).join('');

  el.querySelectorAll('[data-edit-course]').forEach(btn => {
    btn.addEventListener('click', () => startEditCourse(btn.dataset.editCourse));
  });
  el.querySelectorAll('.del[data-type="course"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Remove this course and all its students? This cannot be undone.')) return;
      await supabaseClient.from('courses').delete().eq('id', btn.dataset.id);
      loadManageLists();
    });
  });
}

function startEditCourse(id) {
  const course = coursesCache.find(c => c.id === id);
  const row = document.querySelector(`[data-row-course="${id}"]`);
  row.outerHTML = `
    <div class="edit-form" data-row-course="${id}">
      <input type="text" id="edit-course-input-${id}" value="${course.name.replace(/"/g, '&quot;')}" />
      <button class="save-btn" data-save-course="${id}">Save</button>
      <button class="cancel-btn" data-cancel-course="${id}">Cancel</button>
    </div>`;
  document.querySelector(`[data-save-course="${id}"]`).addEventListener('click', async () => {
    const newName = document.getElementById(`edit-course-input-${id}`).value.trim();
    if (!newName) return;
    await supabaseClient.from('courses').update({ name: newName }).eq('id', id);
    loadManageLists();
  });
  document.querySelector(`[data-cancel-course="${id}"]`).addEventListener('click', loadManageLists);
}

function renderStudentList() {
  const el = document.getElementById('student-list');
  if (!studentsCache.length) { el.innerHTML = '<p style="color:var(--muted);font-size:13px;">No students yet.</p>'; return; }

  el.innerHTML = studentsCache.map(s => `
    <div class="list-item-row" data-row-student="${s.id}">
      <span>${s.name}<div class="sub">${s.courses ? s.courses.name : 'No course'}</div></span>
      <div class="list-item-actions">
        <button class="edit-btn" data-edit-student="${s.id}">Edit</button>
        <button class="del" data-id="${s.id}" data-type="student">Remove</button>
      </div>
    </div>`).join('');

  el.querySelectorAll('[data-edit-student]').forEach(btn => {
    btn.addEventListener('click', () => startEditStudent(btn.dataset.editStudent));
  });
  el.querySelectorAll('.del[data-type="student"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await supabaseClient.from('students').delete().eq('id', btn.dataset.id);
      loadManageLists();
    });
  });
}

function startEditStudent(id) {
  const student = studentsCache.find(s => s.id === id);
  const row = document.querySelector(`[data-row-student="${id}"]`);
  const courseOptions = coursesCache.map(c =>
    `<option value="${c.id}" ${c.id === student.course_id ? 'selected' : ''}>${c.name}</option>`).join('');
  row.outerHTML = `
    <div class="edit-form" data-row-student="${id}">
      <input type="text" id="edit-student-input-${id}" value="${student.name.replace(/"/g, '&quot;')}" />
      <select id="edit-student-course-${id}">${courseOptions}</select>
      <button class="save-btn" data-save-student="${id}">Save</button>
      <button class="cancel-btn" data-cancel-student="${id}">Cancel</button>
    </div>`;
  document.querySelector(`[data-save-student="${id}"]`).addEventListener('click', async () => {
    const newName = document.getElementById(`edit-student-input-${id}`).value.trim();
    const newCourseId = document.getElementById(`edit-student-course-${id}`).value;
    if (!newName || !newCourseId) return;
    await supabaseClient.from('students').update({ name: newName, course_id: newCourseId }).eq('id', id);
    loadManageLists();
  });
  document.querySelector(`[data-cancel-student="${id}"]`).addEventListener('click', loadManageLists);
}

document.getElementById('add-course-btn').addEventListener('click', async () => {
  const input = document.getElementById('new-course-name');
  if (!input.value.trim()) return;
  await supabaseClient.from('courses').insert({ name: input.value.trim() });
  input.value = '';
  loadManageLists();
});

document.getElementById('add-student-btn').addEventListener('click', async () => {
  const nameInput = document.getElementById('new-student-name');
  const courseSelect = document.getElementById('new-student-course');
  if (!nameInput.value.trim() || !courseSelect.value) return;
  await supabaseClient.from('students').insert({ name: nameInput.value.trim(), course_id: courseSelect.value });
  nameInput.value = '';
  loadManageLists();
});

// Realtime: auto-refresh dashboard whenever a new sign-in comes in from any phone
supabaseClient
  .channel('signins-changes')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'signins' }, () => {
    loadDashboard();
  })
  .subscribe();

loadDashboard();
setInterval(loadDashboard, 15000); // fallback refresh in case realtime misses one

// ---- Manual open/closed override ----
const overrideToggle = document.getElementById('override-toggle');
const overrideStatus = document.getElementById('override-status');
const overrideMealRow = document.getElementById('override-meal-row');
const overrideMealSelect = document.getElementById('override-meal-select');

async function loadOverrideState() {
  const { data } = await supabaseClient.from('cookhouse_settings').select('*').eq('id', 1).single();
  if (!data) return;
  if (data.override_mode === 'closed') {
    overrideToggle.checked = true;
    overrideStatus.textContent = 'Forced CLOSED';
    overrideMealRow.style.display = 'none';
  } else if (data.override_mode === 'open') {
    overrideToggle.checked = true;
    overrideStatus.textContent = 'Forced OPEN';
    overrideMealRow.style.display = 'block';
    overrideMealSelect.value = data.override_meal || 'breakfast';
  } else {
    overrideToggle.checked = false;
    overrideStatus.textContent = 'Auto (time-based)';
    overrideMealRow.style.display = 'none';
  }
}

// Toggle cycles: Auto -> Forced Open -> Forced Closed -> Auto
overrideToggle.addEventListener('click', async (e) => {
  e.preventDefault(); // we drive state manually since this is a 3-way cycle, not a plain on/off
  const { data } = await supabaseClient.from('cookhouse_settings').select('override_mode').eq('id', 1).single();
  const current = data ? data.override_mode : 'auto';
  let next;
  if (current === 'auto') next = 'open';
  else if (current === 'open') next = 'closed';
  else next = 'auto';

  const payload = { id: 1, override_mode: next, updated_at: new Date().toISOString() };
  if (next === 'open') payload.override_meal = overrideMealSelect.value || 'breakfast';
  await supabaseClient.from('cookhouse_settings').upsert(payload);
  loadOverrideState();
});

overrideMealSelect.addEventListener('change', async () => {
  await supabaseClient.from('cookhouse_settings')
    .update({ override_meal: overrideMealSelect.value, updated_at: new Date().toISOString() })
    .eq('id', 1);
});

loadOverrideState();

// ---- Download today's report ----
document.getElementById('download-report-btn').addEventListener('click', async () => {
  const today = todayDateString();
  const { data: rows, error } = await supabaseClient
    .from('signins')
    .select('meal, signed_in_at, courses(name)')
    .eq('signin_date', today);

  if (error || !rows) { alert("Could not load today's data for the report."); return; }

  const lines = [];
  lines.push('COOKHOUSE MEAL REPORT');
  lines.push('Date: ' + today);
  lines.push('Generated: ' + new Date().toLocaleString());
  lines.push('='.repeat(50));

  let grandTotal = 0;

  MEAL_WINDOWS.forEach(window => {
    const mealRows = rows.filter(r => r.meal === window.key);
    grandTotal += mealRows.length;

    lines.push('');
    lines.push(window.label.toUpperCase() + ' (' + window.start + '–' + window.end + ')');
    lines.push('-'.repeat(50));
    lines.push('Total signed in: ' + mealRows.length);

    // Counts by course
    const byCourse = {};
    mealRows.forEach(r => {
      const name = r.courses ? r.courses.name : 'Unknown';
      byCourse[name] = (byCourse[name] || 0) + 1;
    });
    lines.push('');
    lines.push('By course:');
    if (Object.keys(byCourse).length === 0) {
      lines.push('  (no sign-ins)');
    } else {
      Object.entries(byCourse).sort((a, b) => b[1] - a[1]).forEach(([name, count]) => {
        lines.push('  ' + name + ': ' + count);
      });
    }

    // Busiest / quietest 15-minute slot within the window
    if (mealRows.length > 0) {
      const bucketMinutes = 15;
      const startMin = toMinutes(window.start);
      const endMin = toMinutes(window.end);
      const buckets = {};
      for (let m = startMin; m < endMin; m += bucketMinutes) buckets[m] = 0;

      mealRows.forEach(r => {
        const d = new Date(r.signed_in_at);
        const mins = d.getHours() * 60 + d.getMinutes();
        const bucketStart = startMin + Math.floor((mins - startMin) / bucketMinutes) * bucketMinutes;
        if (buckets[bucketStart] !== undefined) buckets[bucketStart]++;
      });

      const bucketLabel = (m) => {
        const h = Math.floor(m / 60).toString().padStart(2, '0');
        const mm = (m % 60).toString().padStart(2, '0');
        return h + ':' + mm;
      };

      const entries = Object.entries(buckets).map(([m, c]) => ({ start: Number(m), count: c }));
      const busiest = entries.reduce((a, b) => (b.count > a.count ? b : a));
      const quietest = entries.reduce((a, b) => (b.count < a.count ? b : a));

      lines.push('');
      lines.push('Busiest 15-min slot: ' + bucketLabel(busiest.start) + '–' + bucketLabel(busiest.start + bucketMinutes) + ' (' + busiest.count + ' sign-ins)');
      lines.push('Quietest 15-min slot: ' + bucketLabel(quietest.start) + '–' + bucketLabel(quietest.start + bucketMinutes) + ' (' + quietest.count + ' sign-ins)');
      lines.push('Average per 15-min slot: ' + (mealRows.length / entries.length).toFixed(1));
    }
  });

  lines.push('');
  lines.push('='.repeat(50));
  lines.push('GRAND TOTAL (all sittings): ' + grandTotal);

  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cookhouse-report-' + today + '.txt';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
